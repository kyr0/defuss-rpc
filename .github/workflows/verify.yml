# The same verbs as local development, so CI cannot drift from `make verify`.
name: verify
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # make policy checks every commit message, not only the last one
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      # make setup runs `bunx playwright install --with-deps chromium webkit` when CI is set: the browsers plus the
      # system libraries WebKit needs on Linux (the same as `bunx playwright install-deps chromium webkit`).
      - run: make setup
      - run: make verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-node${{ matrix.node }}
          path: output/
          if-no-files-found: ignore
